services:
  cognito:
    image: jagregory/cognito-local:5.0.0
    ports:
    - 9229:9229
    volumes:
    - ./etc/cognito_local:/app/.cognito-seed:ro
    - cognito-data:/app/.cognito
    entrypoint: sh
    command:
    - -c
    - "cp -r /app/.cognito-seed/. /app/.cognito/ && exec node /app/start.js"
  fastapi_cognito_tests:
    build: {}

volumes:
  cognito-data: {}

