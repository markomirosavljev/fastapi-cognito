[project]
name = "fastapi-cognito"
version = "2.10.0"
description = "AWS Cognito JWT authentication library for FastAPI"
authors = [
    { name = "Marko Mirosavljev", email = "mirosavljevm023@gmail.com" }
]
maintainers = [
    { name = "Marko Mirosavljev", email = "mirosavljevm023@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Intended Audience :: Developers"
]
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "aiofile>=3.8.8",
    "async-lru>=2.0.4",
    "joserfc>=0.9.0",
    "httpx2>=2.1.0",
]

[project.urls]
Repository = "https://github.com/markomirosavljev/fastapi-cognito"

[dependency-groups]
test = [
    "pytest>=8.3.5,<9.0.0",
    "boto3>=1.37.13,<2.0.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::async_lru.AlruCacheLoopResetWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_cognito"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
